name: PR Gate (Tier 1 — lint · type · unit)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-type-test:
    name: Lint · Type · Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Keep every `uv run` in this matrix on the interpreter installed for this
    # matrix leg; otherwise `.python-version` can silently select 3.13 in the
    # Python 3.12 leg after uv recreates the environment.
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    strategy:
      fail-fast: false
      matrix:
        # Keep patch-level versions explicit: these are the required status
        # contexts configured for the default branch, and they make CI's
        # tested interpreter versions reproducible.
        python-version: ["3.12.15", "3.13.16"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1, Node 24

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen --all-extras --python ${{ matrix.python-version }}

      - name: Capture evidence runtime versions
        run: |
          python_version=$(uv run --no-sync python --version | awk '{print $2}')
          pytest_version=$(uv run --no-sync pytest --version | awk '{print $2}')
          uv_version=$(uv --version | awk '{print $2}')
          test -n "$python_version" && test -n "$pytest_version" && test -n "$uv_version"
          echo "PYTHON_VERSION=$python_version" >> "$GITHUB_ENV"
          echo "PYTEST_VERSION=$pytest_version" >> "$GITHUB_ENV"
          echo "UV_VERSION=$uv_version" >> "$GITHUB_ENV"

      - name: Cache FastEmbed ONNX model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0, Node 24
        with:
          path: ~/.cache/fastembed
          # Bump the generation to discard the corrupted model archive restored
          # by the previous cache key. No restore-keys: stale ONNX data must not
          # silently re-enter the cache.
          key: fastembed-onnx-v1-${{ runner.os }}-py${{ matrix.python-version }}

      - name: Ruff lint
        run: uv run ruff check src tests scripts promptfoo

      - name: Ruff format check
        run: uv run ruff format --check src tests scripts promptfoo

      - name: mypy strict
        run: uv run mypy src

      # Multiple xdist workers must not download/extract the same cold archive.
      # Preparation can download a public model asset; the tests still use real embeddings.
      - name: Prepare verified ONNX embedding model before parallel tests
        run: uv run --no-sync python scripts/prepare_embedding_model.py

      - name: Unit + Deterministic tests (no live calls)
        run: |
          mkdir -p reports/evidence/native
          echo "EVIDENCE_STARTED_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
          uv run --no-sync python scripts/run_hermetic.py -- python -m pytest \
            -m "not live and not evidence_control" -n auto --cov=src --cov-report=term-missing \
            --cov-report=json:reports/coverage.json --cov-fail-under=80 \
            --junitxml=reports/evidence/native/deterministic.xml
        env:
          # No API keys — live tests excluded via marker
          PYTHONPATH: src

      - name: Emit deterministic execution evidence
        if: always()
        run: |
          uv run --no-sync python scripts/evidence.py \
            --scope "verity.deterministic-py${{ matrix.python-version }}" \
            --junit reports/evidence/native/deterministic.xml

      - name: Validate deterministic execution evidence
        if: always()
        run: |
          uv run --no-sync python scripts/validate_evidence.py \
            "reports/evidence/verity.deterministic-py${{ matrix.python-version }}.json"

      - name: Module-sensitive coverage gate (agent, retrieval, metrics, tracing, reporting)
        run: uv run python scripts/check_module_coverage.py reports/coverage.json

      - name: Hermetic Tier-2/3 evidence gate (no API key — cassette replay only)
        # Smoke-tests that the calibration and defects-report pipelines run
        # end-to-end without a provider key. --out writes calibration to a
        # scratch path rather than docs/calibration-report.md, which is the
        # committed synthetic authored-score replay (not a live judge run).
        run: |
          PYTHONPATH=src uv run --no-sync python scripts/run_hermetic.py -- \
            python scripts/run_calibration.py --out /tmp/calibration-hermetic-check.md
          uv run --no-sync python scripts/check_calibration_report_migration.py \
            docs/calibration-report.md /tmp/calibration-hermetic-check.md
          PYTHONPATH=src:. uv run --no-sync python scripts/run_hermetic.py -- \
            python scripts/defects_report.py

      - name: Validate current evidence inventory
        run: uv run python scripts/check_current_evidence.py

      - name: Regenerated docs match committed copies
        # defects_report.py above overwrites docs/defects-caught.md in place;
        # a hand-edit to the committed doc that isn't mirrored in the
        # generator would otherwise pass silently until someone runs the
        # regenerate command locally and finds it reverted.
        run: git diff --exit-code docs/defects-caught.md

      - name: Vulnerability exception expiry check
        run: uv run python scripts/check_vuln_exceptions.py

      - name: Vulnerability exception scope check
        run: uv run python scripts/check_vuln_exception_scope.py

      - name: Quarantine metadata and marker reconciliation
        run: uv run python scripts/check_quarantine_policy.py

      - name: Dependency vulnerability scan
        run: |
          ignore_args=()
          while IFS= read -r id; do
            ignore_args+=(--ignore-vuln "$id")
          done < <(grep -vE '^\s*(#|$)' .pip-audit-ignore)
          # The repository itself is installed as an editable local project and
          # is not published to PyPI. Skip that project metadata entry while
          # auditing every installed third-party dependency in the environment.
          uv run pip-audit --desc --skip-editable "${ignore_args[@]}"

      - name: Secret scan
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            zricethezav/gitleaks:v8.28.0 \
            detect --source /repo --redact --verbose

      - name: Static security scan (medium/high only)
        run: uv run bandit -r src/ -ll -c pyproject.toml

      - name: Record the intentional pytest failure
        if: always() && matrix.python-version == '3.12.15'
        id: failure-control-raw
        run: |
          set -euo pipefail
          mkdir -p reports/evidence/native
          rm -f reports/evidence/native/failure-control.xml reports/evidence/native/failure-control-exit.txt
          started_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          echo "started_at=$started_at" >> "$GITHUB_OUTPUT"
          set +e
          VERITY_EVIDENCE_FAILURE_CONTROL=1 uv run --no-sync pytest \
            tests/evidence/test_failure_control.py -m evidence_control -q \
            --junitxml=reports/evidence/native/failure-control.xml
          native_exit=$?
          set -e
          completed_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          echo "completed_at=$completed_at" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$native_exit" > reports/evidence/native/failure-control-exit.txt

      - name: Emit raw expected-failure evidence
        if: always() && matrix.python-version == '3.12.15'
        env:
          EVIDENCE_REQUIRED: "false"
          EVIDENCE_STARTED_AT: ${{ steps.failure-control-raw.outputs.started_at }}
          EVIDENCE_COMPLETED_AT: ${{ steps.failure-control-raw.outputs.completed_at }}
        run: |
          uv run --no-sync python scripts/evidence.py \
            --scope "verity.failure-control-py${{ matrix.python-version }}" \
            --junit reports/evidence/native/failure-control.xml

      - name: Verify the raw failure in a separate pytest process
        if: always() && matrix.python-version == '3.12.15'
        id: failure-control-verifier
        run: |
          set -euo pipefail
          mkdir -p reports/evidence/native
          rm -f reports/evidence/native/failure-control-verification.xml \
            reports/evidence/native/failure-control-verification-exit.txt
          started_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          echo "started_at=$started_at" >> "$GITHUB_OUTPUT"
          set +e
          VERITY_EVIDENCE_CONTROL_VERIFIER=1 uv run --no-sync pytest \
            tests/evidence/test_control_verdict.py \
            -m evidence_control -q \
            --junitxml=reports/evidence/native/failure-control-verification.xml
          verifier_exit=$?
          set -e
          completed_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          echo "completed_at=$completed_at" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$verifier_exit" \
            > reports/evidence/native/failure-control-verification-exit.txt
          exit "$verifier_exit"

      - name: Emit required verifier evidence
        if: always() && matrix.python-version == '3.12.15'
        env:
          EVIDENCE_REQUIRED: "true"
          EVIDENCE_STARTED_AT: ${{ steps.failure-control-verifier.outputs.started_at }}
          EVIDENCE_COMPLETED_AT: ${{ steps.failure-control-verifier.outputs.completed_at }}
        run: |
          if [ -s reports/evidence/native/failure-control-verification.xml ]; then
            uv run --no-sync python scripts/evidence.py \
              --scope "verity.failure-control-verification-py${{ matrix.python-version }}" \
              --junit reports/evidence/native/failure-control-verification.xml
          else
            uv run --no-sync python scripts/evidence.py \
              --scope "verity.failure-control-verification-py${{ matrix.python-version }}" \
              --unavailable-reason "Verifier process did not produce native JUnit results."
          fi

      - name: Validate failure-control evidence records
        if: always() && matrix.python-version == '3.12.15'
        run: |
          uv run --no-sync python scripts/validate_evidence.py \
            "reports/evidence/verity.failure-control-py${{ matrix.python-version }}.json"
          uv run --no-sync python scripts/validate_evidence.py \
            "reports/evidence/verity.failure-control-verification-py${{ matrix.python-version }}.json"

      - name: Upload pytest evidence bundle
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2, Node 24
        with:
          name: verity-evidence-py${{ matrix.python-version }}
          path: reports/evidence/
          if-no-files-found: warn
          retention-days: 30
