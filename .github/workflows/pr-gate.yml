name: PR Gate (Tier 1 — lint · type · unit)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-type-test:
    name: Lint · Type · Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12.15", "3.13.16"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          version: "0.12.23"
          # Keep Python 3.12.15 as the cold-bootstrap leg; the second supported
          # runtime retains the normal package cache for faster feedback.
          enable-cache: ${{ matrix.python-version == '3.13.16' }}
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: bash scripts/install-python.sh ${{ matrix.python-version }}

      - name: Verify empty dependency and model caches for first success
        if: matrix.python-version == '3.12.15'
        run: |
          set -euo pipefail
          export UV_CACHE_DIR="$RUNNER_TEMP/uv-cache-${{ matrix.python-version }}"
          if [[ -e "$UV_CACHE_DIR" ]] && find "$UV_CACHE_DIR" -mindepth 1 -print -quit | grep -q .; then
            echo "The cold-bootstrap uv cache is not empty: $UV_CACHE_DIR" >&2
            exit 1
          fi
          model_cache="$HOME/.cache/chroma/onnx_models"
          if [[ -e "$model_cache" ]] && find "$model_cache" -mindepth 1 -print -quit | grep -q .; then
            echo "The cold-bootstrap Chroma model cache is not empty: $model_cache" >&2
            exit 1
          fi
          echo "COLD_CACHES_VERIFIED=true" >> "$GITHUB_ENV"
          echo "UV_CACHE_DIR=$UV_CACHE_DIR" >> "$GITHUB_ENV"
          echo "FIRST_SUCCESS_STARTED_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
          echo "Verified empty uv and Chroma caches before the first-success path."

      - name: Install dependencies
        run: uv sync --frozen --all-extras --python ${{ matrix.python-version }}

      - name: Capture evidence runtime versions
        run: |
          python_version=$(uv run --no-sync python --version | awk '{print $2}')
          pytest_version=$(uv run --no-sync pytest --version | awk '{print $2}')
          uv_version=$(uv --version | awk '{print $2}')
          test -n "$python_version" && test -n "$pytest_version" && test -n "$uv_version"
          echo "PYTHON_VERSION=$python_version" >> "$GITHUB_ENV"
          echo "PYTEST_VERSION=$pytest_version" >> "$GITHUB_ENV"
          echo "UV_VERSION=$uv_version" >> "$GITHUB_ENV"

      - name: Cache Chroma ONNX embedding model
        if: matrix.python-version == '3.13.16'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/chroma/onnx_models
          # Bump the generation to discard the corrupted model archive restored
          # by the previous cache key. No restore-keys: stale ONNX data must not
          # silently re-enter the cache.
          key: chroma-onnx-v2-${{ runner.os }}-py${{ matrix.python-version }}

      - name: Ruff lint
        run: uv run ruff check src tests scripts promptfoo

      - name: Ruff format check
        run: uv run ruff format --check src tests scripts promptfoo

      - name: mypy strict
        run: uv run mypy src

      # Multiple xdist workers must not download/extract the same cold archive.
      # Preparation can download a public model asset; the tests still use real embeddings.
      - name: Prepare verified ONNX embedding model before parallel tests
        run: uv run --no-sync python scripts/prepare_embedding_model.py

      - name: Unit + Deterministic tests (no live calls)
        run: |
          mkdir -p reports/evidence/native
          echo "EVIDENCE_STARTED_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
          uv run pytest -m "not live and not evidence_control" -n auto --cov=src --cov-report=term-missing \
            --cov-report=json:reports/coverage.json --cov-fail-under=80 \
            --junitxml=reports/evidence/native/deterministic.xml
        env:
          # No API keys — live tests excluded via marker
          PYTHONPATH: src

      - name: Repeat documented no-key first-success command
        if: matrix.python-version == '3.12.15'
        run: make test-deterministic
        env:
          PYTHONPATH: src

      - name: Mark clean-bootstrap path passed
        if: matrix.python-version == '3.12.15' && success()
        run: echo "FIRST_SUCCESS_PASSED=true" >> "$GITHUB_ENV"

      - name: Record clean-bootstrap runtime and native test counts
        if: always() && matrix.python-version == '3.12.15'
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone
          from pathlib import Path

          reports = Path("reports/evidence")
          native = reports / "native/deterministic.xml"
          counts = {"selected": None, "failed": None, "errors": None, "skipped": None}
          suite_seconds = None
          if native.is_file():
              root = ET.parse(native).getroot()
              suites = [root] if root.tag == "testsuite" else root.findall("./testsuite")
              counts = {
                  "selected": sum(int(suite.attrib.get("tests", "0")) for suite in suites),
                  "failed": sum(int(suite.attrib.get("failures", "0")) for suite in suites),
                  "errors": sum(int(suite.attrib.get("errors", "0")) for suite in suites),
                  "skipped": sum(int(suite.attrib.get("skipped", "0")) for suite in suites),
              }
              suite_seconds = sum(float(suite.attrib.get("time", "0")) for suite in suites)
          now = int(time.time())
          started = int(os.environ["FIRST_SUCCESS_STARTED_EPOCH"]) if os.getenv("FIRST_SUCCESS_STARTED_EPOCH") else None
          summary = {
              "schemaVersion": 1,
              "sourceSha": os.environ["GITHUB_SHA"],
              "python": os.environ.get("PYTHON_VERSION"),
              "pytest": os.environ.get("PYTEST_VERSION"),
              "uv": os.environ.get("UV_VERSION"),
              "uvCache": os.environ["UV_CACHE_DIR"],
              "uvCacheWasEmptyBeforeInstall": os.environ.get("COLD_CACHES_VERIFIED", "false").lower() == "true",
              "chromaModelCacheWasEmptyBeforePreparation": os.environ.get("COLD_CACHES_VERIFIED", "false").lower() == "true",
              "commands": [
                  "uv sync --frozen --all-extras --python 3.12.15",
                  "uv run pytest -m 'not live and not evidence_control' -n auto --cov=src --cov-report=term-missing --cov-report=json:reports/coverage.json --cov-fail-under=80 --junitxml=reports/evidence/native/deterministic.xml",
                  "make test-deterministic (repeat)",
              ],
              "firstSuccessPassed": os.environ.get("FIRST_SUCCESS_PASSED", "false").lower() == "true",
              "startedAt": datetime.fromtimestamp(started, timezone.utc).isoformat().replace("+00:00", "Z") if started else None,
              "completedAt": datetime.fromtimestamp(now, timezone.utc).isoformat().replace("+00:00", "Z"),
              "elapsedSeconds": now - started if started else None,
              "nativeSuiteSeconds": suite_seconds,
              "nativeTestCounts": counts,
              "limitations": ["Package installation and the checksum-verified public ONNX model need network access.", "No paid-provider credentials or live model calls are used."],
          }
          reports.mkdir(parents=True, exist_ok=True)
          (reports / "clean-bootstrap-summary.json").write_text(json.dumps(summary, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(summary, indent=2))
          PY

      - name: Emit deterministic execution evidence
        if: always()
        run: |
          uv run --no-sync python scripts/evidence.py \
            --scope "verity.deterministic-py${{ matrix.python-version }}" \
            --junit reports/evidence/native/deterministic.xml

      - name: Validate deterministic execution evidence
        if: always()
        run: |
          uv run --no-sync python scripts/validate_evidence.py \
            "reports/evidence/verity.deterministic-py${{ matrix.python-version }}.json"

      - name: Module-sensitive coverage gate (agent, retrieval, metrics, tracing, reporting)
        run: uv run python scripts/check_module_coverage.py reports/coverage.json

      - name: Hermetic Tier-2/3 evidence gate (no API key — cassette replay only)
        # Smoke-tests that the calibration and defects-report pipelines run
        # end-to-end without a provider key. --out writes calibration to a
        # scratch path rather than docs/calibration-report.md, which holds
        # committed evidence from an actual live run (see README Limitations)
        # that this hermetic smoke run must not overwrite.
        run: |
          PYTHONPATH=src uv run python scripts/run_calibration.py --out /tmp/calibration-hermetic-check.md
          PYTHONPATH=src:. uv run python scripts/defects_report.py

      - name: Regenerated docs match committed copies
        # defects_report.py above overwrites docs/defects-caught.md in place;
        # a hand-edit to the committed doc that isn't mirrored in the
        # generator would otherwise pass silently until someone runs the
        # regenerate command locally and finds it reverted.
        run: git diff --exit-code docs/defects-caught.md

      - name: Quarantine ownership and calendar review gate
        run: uv run --no-sync python scripts/check_quarantine_policy.py

      - name: Vulnerability exception expiry check
        run: uv run python scripts/check_vuln_exceptions.py

      - name: Dependency vulnerability scan
        run: |
          ignore_args=()
          while IFS= read -r id; do
            ignore_args+=(--ignore-vuln "$id")
          done < <(grep -vE '^\s*(#|$)' .pip-audit-ignore)
          uv run pip-audit --desc "${ignore_args[@]}"

      - name: Secret scan
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            zricethezav/gitleaks:v8.28.0 \
            detect --source /repo --redact --verbose

      - name: Static security scan (medium/high only)
        run: uv run bandit -r src/ -ll -c pyproject.toml

      - name: Record and verify the expected pytest failure
        if: always() && matrix.python-version == '3.12.15'
        run: |
          mkdir -p reports/evidence/native
          echo "EVIDENCE_STARTED_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
          set +e
          VERITY_EVIDENCE_FAILURE_CONTROL=1 uv run --no-sync pytest \
            tests/evidence/test_failure_control.py -m evidence_control -q \
            --junitxml=reports/evidence/native/failure-control.xml
          native_exit=$?
          set -e
          uv run --no-sync python scripts/verify_failure_control.py \
            --junit reports/evidence/native/failure-control.xml --native-exit "$native_exit"

      - name: Emit expected-failure evidence
        if: always() && matrix.python-version == '3.12.15'
        run: |
          uv run --no-sync python scripts/evidence.py \
            --scope "verity.failure-control-py${{ matrix.python-version }}" \
            --junit reports/evidence/native/failure-control.xml

      - name: Validate expected-failure evidence
        if: always() && matrix.python-version == '3.12.15'
        run: |
          uv run --no-sync python scripts/validate_evidence.py \
            "reports/evidence/verity.failure-control-py${{ matrix.python-version }}.json"

      - name: Upload pytest evidence bundle
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: verity-evidence-py${{ matrix.python-version }}
          path: reports/evidence/
          if-no-files-found: warn
          retention-days: 30
