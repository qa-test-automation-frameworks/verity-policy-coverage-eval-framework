name: Adversarial Red-Team

on:
  schedule:
    # Weekly: every Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      run_live:
        description: Run the provider-backed red-team and calibration jobs
        type: boolean
        required: false
        default: true

jobs:
  key_check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_key: ${{ steps.check.outputs.has_key }}
    steps:
      - id: check
        run: |
          if [ -n "${{ secrets.VERITY_ZAI_API_KEY }}${{ secrets.VERITY_OPENROUTER_API_KEY }}${{ secrets.VERITY_TOGETHER_API_KEY }}${{ secrets.VERITY_NVIDIA_API_KEY }}${{ secrets.VERITY_GOOGLE_API_KEY }}" ]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
          fi

  redteam-hermetic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1, Node 24

      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa  # v10.3.1
        with:
          enable-cache: false

      - name: Install pinned Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --frozen --extra dev --extra report

      - name: Hermetic adversarial suite
        run: |
          mkdir -p reports/junit reports/allure-results/adversarial
          env \
            -u VERITY_ZAI_API_KEY -u VERITY_OPENROUTER_API_KEY -u VERITY_OPENROUTER_API_KEY_2 \
            -u VERITY_TOGETHER_API_KEY -u VERITY_NVIDIA_API_KEY -u VERITY_GOOGLE_API_KEY \
            -u ZAI_API_KEY -u OPENROUTER_API_KEY -u OPENROUTER_API_KEY_2 \
            -u TOGETHER_API_KEY -u NVIDIA_API_KEY -u GOOGLE_API_KEY -u GEMINI_API_KEY \
            -u VERITY_ZAI_API_BASE -u VERITY_OPENROUTER_API_BASE -u VERITY_TOGETHER_API_BASE \
            -u VERITY_NVIDIA_API_BASE -u VERITY_GOOGLE_API_BASE \
            -u ZAI_API_BASE -u OPENROUTER_API_BASE -u TOGETHER_API_BASE \
            -u NVIDIA_API_BASE -u GOOGLE_API_BASE \
            PYTHONPATH=src uv run --no-sync pytest tests/adversarial/ -m adversarial -v \
            --junitxml reports/junit/adversarial.xml \
            --alluredir reports/allure-results/adversarial

      - name: Verify adversarial reports
        if: always()
        run: |
          test -s reports/junit/adversarial.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          root = ET.parse("reports/junit/adversarial.xml").getroot()
          suites = list(root.iter("testsuite"))
          cases = list(root.iter("testcase"))
          adversarial_cases = [
              case
              for case in cases
              if "test_redteam_hermetic" in case.get("classname", "")
          ]
          if not cases or not adversarial_cases:
              raise SystemExit("JUnit must contain collected adversarial test cases")
          skipped = sum(int(suite.get("skipped", "0")) for suite in suites)
          if len(cases) <= skipped:
              raise SystemExit("JUnit contains no executed adversarial tests")
          allure_results = list(Path("reports/allure-results/adversarial").glob("*-result.json"))
          if not allure_results:
              raise SystemExit("Allure result files are missing")
          print(
              f"Verified {len(adversarial_cases)} adversarial JUnit cases "
              f"and {len(allure_results)} Allure results"
          )
          PY

      - name: Upload adversarial reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2, Node 24
        with:
          name: adversarial-reports
          path: |
            reports/junit/adversarial.xml
            reports/allure-results/adversarial/
            reports/security/summary-local.json
            reports/security/summary-local.md
          if-no-files-found: warn

  redteam-live:
    needs: key_check
    if: >-
      needs.key_check.outputs.has_key == 'true' &&
      (github.event_name != 'workflow_dispatch' || inputs.run_live)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1, Node 24

      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa  # v10.3.1

      - name: Install pinned Python
        run: uv python install

      # The Python provider imports only project base dependencies; pytest/report extras stay out.
      - name: Install dependencies
        run: uv sync --frozen

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "20"

      - name: Promptfoo live red-team eval
        env:
          VERITY_ZAI_API_KEY: ${{ secrets.VERITY_ZAI_API_KEY }}
          VERITY_OPENROUTER_API_KEY: ${{ secrets.VERITY_OPENROUTER_API_KEY }}
          VERITY_TOGETHER_API_KEY: ${{ secrets.VERITY_TOGETHER_API_KEY }}
          VERITY_NVIDIA_API_KEY: ${{ secrets.VERITY_NVIDIA_API_KEY }}
          VERITY_GOOGLE_API_KEY: ${{ secrets.VERITY_GOOGLE_API_KEY }}
          VERITY_CASSETTE_MODE: off
        run: |
          mkdir -p reports/redteam
          uv run --no-sync npx --yes promptfoo@0.121.17 eval \
            --config promptfoo/redteam.yaml \
            --output reports/redteam/results.json

      - name: Upload red-team report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2, Node 24
        with:
          name: redteam-report
          path: reports/redteam/

  calibrate-live:
    needs: key_check
    if: >-
      needs.key_check.outputs.has_key == 'true' &&
      (github.event_name != 'workflow_dispatch' || inputs.run_live)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1, Node 24

      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa  # v10.3.1

      - name: Install pinned Python
        run: uv python install

      # Calibration imports base project modules, not pytest or semantic extras.
      - name: Install dependencies
        run: uv sync --frozen

      - name: Live calibration run
        env:
          VERITY_ZAI_API_KEY: ${{ secrets.VERITY_ZAI_API_KEY }}
          VERITY_OPENROUTER_API_KEY: ${{ secrets.VERITY_OPENROUTER_API_KEY }}
          VERITY_TOGETHER_API_KEY: ${{ secrets.VERITY_TOGETHER_API_KEY }}
          VERITY_NVIDIA_API_KEY: ${{ secrets.VERITY_NVIDIA_API_KEY }}
          VERITY_GOOGLE_API_KEY: ${{ secrets.VERITY_GOOGLE_API_KEY }}
        run: |
          mkdir -p reports
          PYTHONPATH=src uv run --no-sync python scripts/run_calibration.py --record

      - name: Upload calibration report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2, Node 24
        with:
          name: calibration-report
          path: docs/calibration-report.md
