name: Authored calibration fixture provenance

on:
  pull_request:
    paths:
      - 'scripts/run_calibration.py'
      - 'scripts/regenerate_authored_calibration.py'
      - 'datasets/calibration/**'
      - '.github/workflows/calibration-fixtures.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv python install
      - run: uv sync --frozen --extra dev
      - name: Regenerate fixtures and verify unchanged calculations
        env:
          PYTHONPATH: src:.
        run: |
          mkdir -p reports/calibration-fixture-migration
          cp docs/calibration-report.md reports/calibration-fixture-migration/before.md
          uv run --no-sync python scripts/regenerate_authored_calibration.py
          uv run --no-sync python scripts/run_hermetic.py -- python scripts/run_calibration.py
          uv run --no-sync python scripts/check_calibration_report_migration.py \
            reports/calibration-fixture-migration/before.md docs/calibration-report.md \
            | tee reports/calibration-fixture-migration/verification.txt
      - name: Retain generated fixtures and calculation report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: authored-calibration-fixtures
          path: |
            datasets/calibration/cassettes/authored-score-v2/
            datasets/calibration/cassettes/authored-score-v2-manifest.json
            docs/calibration-report.md
            reports/calibration-fixture-migration/
          if-no-files-found: error
          retention-days: 30
