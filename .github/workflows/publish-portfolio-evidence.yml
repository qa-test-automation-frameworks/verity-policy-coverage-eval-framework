name: Publish trusted portfolio evidence

on:
  workflow_run:
    workflows:
      - PR Gate (Tier 1 — lint · type · unit)
      - Semantic Eval (Tier 2 — DeepEval · RAGAS)
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: >-
      github.event.workflow_run.repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main' &&
      contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event.workflow_run.event)
    uses: qa-test-automation-frameworks/.github/.github/workflows/publish-evidence.yml@7960801249c036ef56370f54abdf79570b5a7bd8
    with:
      source-run-id: ${{ github.event.workflow_run.id }}
      workflow-file: ${{ github.event.workflow_run.name == 'PR Gate (Tier 1 — lint · type · unit)' && '.github/workflows/pr-gate.yml' || '.github/workflows/semantic-eval.yml' }}
