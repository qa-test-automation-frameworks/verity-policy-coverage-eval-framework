name: Container Image Scan

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docker-scan.yml"
  pull_request:
    branches: [main]
    # This is a required branch-protection context. Path-filtered PR workflows
    # leave the required check in Expected state when unrelated files change.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-scan:
    name: Build image and scan with Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1, Node 24

      - name: Build image
        run: docker build --build-arg VERITY_SOURCE_SHA="${{ github.sha }}" -t verity-eval:scan .

      # Validate the copied runtime filesystem, not only the builder-stage
      # environment. Trivy scans this final image and this check must inspect
      # the same bytes before the vulnerability gate runs.
      - name: Verify final image runtime package metadata
        run: >-
          docker run --rm --entrypoint /app/.venv/bin/python verity-eval:scan
          scripts/check_runtime_package_versions.py

      - name: Check security exception expiries
        run: docker run --rm --entrypoint /app/.venv/bin/python verity-eval:scan scripts/check_vuln_exceptions.py

      - name: Check exception scope against lockfile
        run: python3 scripts/check_vuln_exception_scope.py

      - name: Run packaged Tier-1 checks
        run: docker run --rm verity-eval:scan

      - name: Scan image with Trivy
        # v0.36.0 includes the fix for duplicate package entries in embedded wheel SBOMs.
        # Pin the verified post-2025-04-09 commit because older Trivy Action tags were
        # force-pushed during the March 2026 supply-chain incident.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          version: v0.76.0
          image-ref: verity-eval:scan
          format: json
          output: trivy-results.json
          severity: CRITICAL,HIGH
          exit-code: "1"
          trivyignores: .trivyignore

      # Keep the full package paths available when the blocking scan fails;
      # the table formatter omits paths needed to distinguish duplicate installs.
      - name: Retain Trivy findings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2, Node 24
        with:
          name: trivy-results
          path: trivy-results.json
          if-no-files-found: warn
          retention-days: 14
