name: Container Image Scan

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docker-scan.yml"
  pull_request:
    branches: [main]
    paths:
      - "Dockerfile"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docker-scan.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-scan:
    name: Build image and scan with Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Build image
        run: docker build -t verity-eval:scan .

      - name: Run packaged Tier-1 checks
        run: docker run --rm verity-eval:scan

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8  # v0.24.0
        with:
          image-ref: verity-eval:scan
          format: json
          output: trivy-results.json
          severity: CRITICAL,HIGH
          exit-code: "1"

      # Keep the full package paths available when the blocking scan fails;
      # the table formatter omits paths needed to distinguish duplicate installs.
      - name: Retain Trivy findings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: trivy-results
          path: trivy-results.json
          if-no-files-found: warn
          retention-days: 14
