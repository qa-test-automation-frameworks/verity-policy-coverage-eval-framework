name: Container Image Scan

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docker-scan.yml"
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-scan:
    name: Build image and scan with Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build -t verity-eval:scan .

      - name: Verify the non-root ONNX cache works without network access
        run: |
          docker run --rm --network=none --entrypoint uv verity-eval:scan run --no-sync python -c \
            "import os; from chromadb.utils.embedding_functions import DefaultEmbeddingFunction; from chromadb.utils.embedding_functions.onnx_mini_lm_l6_v2 import ONNXMiniLM_L6_V2; cache = ONNXMiniLM_L6_V2.DOWNLOAD_PATH; vectors = DefaultEmbeddingFunction()(['offline appuser cache check']); assert os.geteuid() != 0 and cache.is_dir() and len(vectors) == 1 and len(vectors[0]) > 0; print(f'uid={os.geteuid()} cache={cache} dimensions={len(vectors[0])}')"

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8 # v0.24.0
        with:
          image-ref: verity-eval:scan
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
