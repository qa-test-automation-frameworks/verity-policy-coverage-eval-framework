[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "verity-policy-coverage-eval-framework"
version = "0.1.0"
description = "A structured, multi-tier evaluation framework for LLM applications — demonstrated on a policy coverage RAG + tool-use assistant."
license = { text = "MIT" }
authors = [{ name = "prayagv" }]
requires-python = ">=3.12,<3.14"
readme = "README.md"
keywords = ["evaluation", "rag", "testing", "quality", "policy", "guardrails"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "litellm>=1.45.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "fastembed>=0.9.0,<1",
    "pyyaml>=6.0.1",
    "httpx>=0.28.1,<1",
]

[project.optional-dependencies]
dev = [
    "ruff==0.17.1",
    # The Tier-1 image verifies this package against a known security floor.
    "setuptools>=83.0.0",
    "mypy>=2.4.0",
    "jsonschema>=4.26.0",
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "pytest-xdist>=3.6.0",
    "pre-commit>=3.7.0",
    "types-PyYAML>=6.0.12",
    "bandit>=1.7.0",
    "hypothesis>=6.156.6",
]
security = [
    # CI uses this audit tool; keep pip and its vendored scanner SBOM out of the
    # runtime test image, where dependency auditing is not performed.
    "pip-audit>=2.7.0",
]
semantic = [
    "deepeval>=1.5.0",
    # Stay on the reviewed version while its local-file/SSRF advisory is
    # unpatched; reassess this bound before any version change.
    "ragas==0.4.3",
]
otel = [
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.25.0",
]
report = [
    "allure-pytest>=2.13.0",
    "markdown>=3.6",
]
mutation = [
    "mutmut>=3.2.0",
]

[project.urls]
Homepage = "https://github.com/qa-test-automation-frameworks/verity-policy-coverage-eval-framework"
Repository = "https://github.com/qa-test-automation-frameworks/verity-policy-coverage-eval-framework"
Issues = "https://github.com/qa-test-automation-frameworks/verity-policy-coverage-eval-framework/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/verity", "src/sut"]

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "N", "RUF", "TID"]
ignore = [
    "ANN401",  # Any allowed for dynamic provider and ONNX model boundaries
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]  # no return-type annotations required in tests

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"diskcache" = { msg = "Do not enable the vulnerable optional DiskCache backend without a reviewed dependency disposition." }
"ragas.cache" = { msg = "Do not enable the vulnerable optional RAGAS DiskCache backend without a reviewed dependency disposition." }
"ragas.metrics.collections" = { msg = "RAGAS collections include vulnerable multimodal URL/local-file processing; review before adoption." }
"ragas.prompt.multi_modal_prompt" = { msg = "Review this multimodal prompt path for URL and local-file handling before adoption." }

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_return_any = true
show_error_codes = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["litellm.*", "fastembed.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["deepeval.*", "ragas.*", "langchain.*", "langchain_core.*", "datasets.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["opentelemetry.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["markdown.*", "allure.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "evidence_control: marks an intentionally failing test used only by the negative evidence control",
    "live: marks tests that make real LLM API calls (deselect with -m 'not live')",
    "deterministic: marks Tier-1 deterministic tests (no live calls)",
    "semantic: marks Tier-2 semantic eval tests (requires live LLM)",
    "adversarial: marks Tier-3 adversarial/red-team tests",
    "flaky: marks live tests with known provider instability and documented retry policy (reserved: apply once a specific test has an observed instability history to document)",
    "quarantine: marks live tests that collect signal but should not block merges",
    "needs_onnx_download: marks tests requiring a local FastEmbed ONNX model download (network on first run, not truly hermetic; deselect with -m 'not needs_onnx_download')",
]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
fail_under = 80

[tool.bandit]
skips = ["B101"]  # assert is intentional in framework internal guards

# ---------------------------------------------------------------------------
# mutmut (mutation testing) — scoped to deterministic framework and demo-target
# modules: src/sut/tools/coverage_calculator.py and src/verity/checks.py. They
# are pure, have no I/O, and carry the arithmetic plus core check semantics
# where mutation score is most meaningful and cheapest to check. Run with:
# uv run --extra mutation mutmut run && uv run --extra mutation mutmut results
# ---------------------------------------------------------------------------
[tool.mutmut]
source_paths = ["src"]
only_mutate = ["src/sut/tools/coverage_calculator.py", "src/verity/checks.py"]
pytest_add_cli_args_test_selection = ["tests/unit/test_coverage_calculator.py", "tests/unit/test_checks.py"]
runner = "python -m pytest -x -q"

# Advisory fix floors for resolved transitive dependencies. These constraints do
# not install otherwise unused packages and prevent a later resolution downgrade.
[tool.uv]
constraint-dependencies = [
    "aiohttp>=3.14.3",
    "anyio>=4.14.2",
    "datasets>=5.0.1",
    "fsspec>=2026.6.0",
    "langgraph-sdk>=0.4.4",
    "litellm>=1.90.7",
    "multidict>=6.9.1",
    "oauthlib>=4.0.0",
    "pillow>=12.3.0",
    "pip>=26.2",
    "setuptools>=83.0.0",
    "urllib3>=2.8.0",
    "virtualenv>=21.7.13",
]
